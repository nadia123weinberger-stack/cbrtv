name: Update sports fixtures
on:
  schedule:
    - cron: "15 */6 * * *"     # every 6 hours
  workflow_dispatch: {}         # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download fixtures
        run: SPORTS_OUT=sports-cache.json node sports-fetch.js
      - name: Save if changed
        run: |
          git config user.name "fixtures-bot"
          git config user.email "fixtures-bot@users.noreply.github.com"
          git add sports-cache.json
          git diff --cached --quiet || (git commit -m "Update fixtures" && git push)
